body.noir #app .cooking-head textarea::placeholder{color:#8f846f}
body.noir #app .timerbtn{background:transparent;color:#e2c48a;border:1px solid #c9a55c}
body.noir #app .steps li.nextstep{background:radial-gradient(120% 140% at 15% 0,#3a2a1c,#16120e 70%);box-shadow:-10px 0 0 #2a1f15,10px 0 0 #16120e,0 8px 26px rgba(0,0,0,.5);outline:1px solid rgba(201,165,92,.55);outline-offset:4px;color:#fff;border-radius:4px}
body.noir #app .steps li.nextstep::after{color:#14100b;background:#e2c48a;padding:2px 6px;border-radius:99px;font-weight:600;top:auto;bottom:-10px;left:-6px;width:auto;text-align:center}
body.noir #app .steps:has(li.nextstep) li:not(.nextstep){opacity:.62}
/* Någon börjar laga (nov 2026): NU-bricka med pulserande prick i Senaste i köket */
.nowdot{display:inline-flex;align-items:center;gap:5px;margin-left:6px;font:600 9.5px var(--sans);letter-spacing:.16em;color:#14100b;background:#e2c48a;border-radius:99px;padding:2px 7px 2px 6px;vertical-align:middle;white-space:nowrap}
.nowdot::before{content:"";width:6px;height:6px;border-radius:50%;background:#b3261e;animation:nwp 1.6s ease-in-out infinite}
@keyframes nwp{50%{opacity:.25}}
.fitem.cooking-now{background:linear-gradient(90deg,rgba(201,165,92,.12),transparent)}
@media (prefers-reduced-motion:reduce){.nowdot::before{animation:none}}
/* Pulserande händelseikon: lagar/blandar nu */
.evi.evi-live{position:relative;animation:eviP 1.8s ease-in-out infinite}
.evi.evi-live::after{content:"";position:absolute;inset:-1px;border-radius:50%;animation:eviR 1.8s ease-out infinite;pointer-events:none}
@keyframes eviP{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes eviR{0%{box-shadow:0 0 0 0 rgba(226,196,138,.75)}80%,100%{box-shadow:0 0 0 7px rgba(226,196,138,0)}}
@media (prefers-reduced-motion:reduce){.evi.evi-live,.evi.evi-live::after{animation:none}}
/* Börja blanda (C, nov 2026): en knapp genom flödet, stegen bockas av */
.dk-mix svg[viewBox="0 0 24 32"]{width:18px;height:26px}
.dk-mix.go{background:linear-gradient(180deg,#d9b56c,#a8823f);color:#14100b;border-color:#e2c48a;box-shadow:0 0 0 4px rgba(226,196,138,.18),0 0 24px rgba(226,196,138,.4)}
.dk-mix.go svg,.dk-mix.go svg *{color:#14100b;stroke:#14100b}
.dk-prog{width:100%;max-width:340px;height:3px;background:rgba(201,165,92,.2);border-radius:3px;overflow:hidden}
.dk-prog i{display:block;height:100%;background:#e2c48a;transition:width .3s}
.dk-stop{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#c9b48a;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.dk .dk-steps.mixing li{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .2s}
.dk .dk-steps li.dk-done{opacity:.45}
.dk .dk-steps li.dk-done::before{content:"✓";background:#c9a55c;color:#14100b}
.dk .dk-steps li.dk-next{background:radial-gradient(120% 140% at 0 50%,rgba(226,196,138,.16),transparent 70%);outline:1px solid #c9a55c;border-radius:12px;padding:10px}
.dk .dk-steps li.dk-next::before{background:#e2c48a;color:#14100b}
/* Sektioner under lagning (B, nov 2026): kort per sektion, fäll ihop/ut, NU-rad med bockruta, ✓ KLAR */
.steps li.group.sec-card{display:block;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;border:1px solid rgba(201,165,92,.4);border-radius:14px;padding:10px 14px 12px!important;margin:14px 0 6px;background:linear-gradient(180deg,rgba(201,165,92,.07),rgba(201,165,92,.02));opacity:1!important;font-size:inherit}
.steps li.group.sec-card:first-child{margin-top:4px}
.steps li.group.sec-card.isdone{border-color:#c9a55c;background:rgba(201,165,92,.1)}
.sec-row{display:flex;align-items:center;gap:10px}
.sec-chev{font:400 13px var(--sans);font-style:normal;color:#c9a55c;width:16px;display:inline-block;transition:transform .2s}
.sec-card.closed .sec-chev{transform:rotate(-90deg)}
.sec-name{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3}
.sec-card.isdone .sec-name{color:#8d7a55}
.sec-cnt{margin-left:auto;font:500 12px var(--sans);font-style:normal;letter-spacing:.08em;color:#a99a76;white-space:nowrap}
.sec-ok{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 10px var(--sans);font-style:normal;letter-spacing:.18em;color:#14100b;background:#e2c48a;border-radius:99px;padding:4px 10px 4px 8px}
.sec-ok::before{content:"✓";font-size:12px}
.sec-bar{height:3px;background:rgba(201,165,92,.18);border-radius:3px;margin:8px 0 0;overflow:hidden}
.sec-bar i{display:block;height:100%;background:#e2c48a;transition:width .3s}
.sec-now{display:flex;gap:8px;align-items:center;margin-top:10px;font:400 15px var(--sans);font-style:normal;color:#ddd5c8}
.sec-now b{font:600 9.5px var(--sans);letter-spacing:.16em;color:#14100b;background:#e2c48a;border-radius:99px;padding:2px 7px;flex:none}
.sec-now span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .sec-now .sbox{position:static;flex:none;cursor:pointer;padding:0}
body.noir #app .steps .sec-now .sbox{background-color:transparent;border-color:#c9a55c}
/* Timrar (C, nov 2026): nedräkning i steget, startruta, timerlist längst ner */
.tb-run{display:inline-flex;align-items:center;gap:7px;margin:6px 0 0 8px;padding:3px 4px 3px 8px;border-radius:999px;background:linear-gradient(180deg,#e2c48a,#b8913f);color:#14100b;font:600 14px var(--sans);font-variant-numeric:tabular-nums;box-shadow:0 0 0 4px rgba(226,196,138,.18),0 0 20px rgba(226,196,138,.45);vertical-align:1px;cursor:default;white-space:nowrap}
.tb-run.done{background:#b3261e;color:#fff;animation:tmBlink 1s ease-in-out infinite}
.tb-run.done .tm-ring{display:none}
@keyframes tmBlink{50%{box-shadow:0 0 0 6px rgba(179,38,30,.25),0 0 26px rgba(179,38,30,.6)}}
.tb-x{width:24px;height:24px;flex:none;border-radius:50%;border:0;background:rgba(20,16,11,.18);color:inherit;font:600 13px var(--sans);display:grid;place-items:center;padding:0;cursor:pointer}
.tb-ask{display:inline-flex;align-items:center;gap:8px;margin:6px 0 0 8px;padding:3px 5px 3px 12px;border-radius:999px;border:1px solid #c9a55c;background:#14100b;color:#efe1c2;font:500 13px var(--sans);vertical-align:1px;white-space:nowrap}
.tb-ask button{border:0;border-radius:99px;padding:4px 11px;font:600 12px var(--sans);cursor:pointer}
.tb-ask .y{background:#b3261e;color:#fff}.tb-ask .n{background:transparent;color:#c9b48a}
.tmflash{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:9999;background:rgba(14,13,12,.94);border:1px solid #e2c48a;border-radius:22px;padding:22px 32px;text-align:center;color:#efe1c2;box-shadow:0 0 60px rgba(226,196,138,.35);pointer-events:none;animation:tmIn .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .45s,transform .45s}
.tmflash.out{opacity:0;transform:translate(-50%,-50%) scale(.9)}
.tmflash .big{font:500 48px var(--serif);color:#e2c48a;font-variant-numeric:tabular-nums;line-height:1}
.tmflash small{display:block;font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-top:10px;color:#c9b48a}
@keyframes tmIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
.tmdock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:8px;overflow-x:auto;padding:8px;border-radius:18px;background:rgba(14,13,12,.95);border:1px solid #c9a55c;box-shadow:0 10px 30px rgba(0,0,0,.6);scrollbar-width:none}
.tmdock::-webkit-scrollbar{display:none}
.tmd-r{flex:none;max-width:88%;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid rgba(201,165,92,.45);border-radius:12px;background:rgba(201,165,92,.07);color:#efe1c2;font:400 13.5px var(--sans);position:relative;overflow:hidden}
.tmd-r:only-child{flex:1;max-width:none}
.tmd-r.new{border-color:#e2c48a;box-shadow:0 0 0 3px rgba(226,196,138,.2),0 0 22px rgba(226,196,138,.35)}
.tmd-r.done{border-color:#b3261e;background:rgba(179,38,30,.18);animation:tmBlink 1s ease-in-out infinite}
.tmd-r b{font:600 18px var(--sans);font-variant-numeric:tabular-nums;color:#e2c48a;flex:none}
.tmd-r.done b{color:#ff8a80}
.tmd-t{flex:1;min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmd-bar{position:absolute;left:0;bottom:0;height:2px;background:#e2c48a}
.tmd-r .tb-x{background:rgba(201,165,92,.15);color:#e2c48a}
.tmd-r.ask .tb-ask{margin:0}
body.has-tmdock{padding-bottom:84px}
body.has-tmdock .shopfab,body.has-tmdock .fab{bottom:calc(96px + env(safe-area-inset-bottom))}
body.has-tmdock .cookbar .tm:not(.tm-add){display:none}
@media(min-width:900px){.tmdock{left:auto;right:24px;bottom:24px;flex-direction:column;width:330px;overflow:visible}.tmd-r{max-width:none}.tmd-t{max-width:none}body.has-tmdock{padding-bottom:0}body.has-tmdock .shopfab,body.has-tmdock .fab{bottom:calc(24px + env(safe-area-inset-bottom));right:370px}}
</style>
</head>
